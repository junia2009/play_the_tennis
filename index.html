<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Play the Tennis</title>
<meta name="description" content="スマホで遊べる3Dテニスゲーム">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#0d2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tennis">
<style>
:root{
  --bg:#0b1b2e; --panel:rgba(10,24,42,.92); --line:rgba(255,255,255,.14);
  --text:#f4f8fc; --muted:#9fb3c8; --accent:#ffd54a; --blue:#2f8cff; --good:#4caf50; --bad:#ef5350;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}

/* ── スコアボード ── */
#hud{position:fixed;top:calc(8px + var(--safe-t));left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
#hud[hidden]{display:none}
.board{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px;min-width:170px;
  box-shadow:0 4px 14px rgba(0,0,0,.35)}
.board .row{display:grid;grid-template-columns:1fr 34px 42px;align-items:center;height:28px}
.board .row + .row{border-top:1px solid var(--line)}
.board .name{padding:0 10px;font-weight:600;display:flex;align-items:center;gap:6px}
.board .name::before{content:"";width:7px;height:7px;border-radius:50%;background:transparent}
.board .name.serving::before{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.board .g{text-align:center;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.board .p{text-align:center;font-weight:800;background:rgba(255,255,255,.08);height:100%;line-height:28px;font-variant-numeric:tabular-nums}
.board .tag{font-size:10px;letter-spacing:1px;color:var(--muted);padding:3px 10px;border-top:1px solid var(--line)}
#pauseBtn{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  font-size:16px;font-weight:800;letter-spacing:1px}
#call{position:fixed;top:calc(78px + var(--safe-t));left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:20px;
  background:rgba(0,0,0,.55);font-size:14px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
#call.on{opacity:1}

/* ── メッセージ ── */
.msg{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%) scale(.9);text-align:center;pointer-events:none;
  opacity:0;transition:opacity .2s,transform .2s;z-index:8;white-space:nowrap}
.msg.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.msg .t{font-size:clamp(26px,8vw,44px);font-weight:900;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.5)}
.msg .s{margin-top:4px;font-size:15px;font-weight:700;display:inline-block;padding:3px 14px;border-radius:14px;background:rgba(0,0,0,.5)}
.msg.good .t{color:#b9f6ca}.msg.bad .t{color:#ffcdd2}.msg.fault .t{color:#ffe082}.msg.game .t{color:var(--accent)}

#hint{position:fixed;left:50%;top:calc(116px + var(--safe-t));transform:translateX(-50%);font-size:13px;font-weight:600;
  padding:5px 12px;border-radius:14px;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s;pointer-events:none;z-index:6;white-space:nowrap}
#hint.on{opacity:1}

/* ── 操作 ── */
#controls{position:fixed;inset:0;z-index:4;pointer-events:none}
#controls[hidden]{display:none}
#stickZone{position:absolute;left:0;bottom:0;width:55%;height:62%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;left:calc(70px + var(--safe-l));top:calc(100% - 100px - var(--safe-b));width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);opacity:.55;transition:opacity .15s}
#stickBase.active{opacity:1}
#stickKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#fff,#9fc7ff 45%,#2f6fd8);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#shots{position:absolute;right:calc(14px + var(--safe-r));bottom:calc(20px + var(--safe-b));width:178px;height:178px;pointer-events:auto}
.shot{position:absolute;width:66px;height:66px;border-radius:50%;border:2px solid rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.5);
  box-shadow:0 3px 10px rgba(0,0,0,.4);touch-action:none;transition:transform .06s}
.shot.pressed{transform:scale(.88);filter:brightness(1.25)}
.shot[data-shot=flat]{right:0;top:56px;width:76px;height:76px;font-size:13px;background:radial-gradient(circle at 35% 30%,#8ec5ff,#1565c0)}
.shot[data-shot=topspin]{left:0;top:56px;background:radial-gradient(circle at 35% 30%,#a5e6a8,#2e7d32)}
.shot[data-shot=lob]{left:56px;top:0;background:radial-gradient(circle at 35% 30%,#e1b7ef,#7b1fa2)}
.shot[data-shot=slice]{left:56px;bottom:0;background:radial-gradient(circle at 35% 30%,#ffd29a,#e65100)}

/* ── オーバーレイ ── */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(180deg,rgba(5,15,30,.35),rgba(5,15,30,.75));overflow:auto}
#overlay[hidden]{display:none}
.panel{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 18px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel h2{text-align:center;font-size:22px}
.logo{text-align:center;font-size:20px;letter-spacing:4px;line-height:1.1;margin:4px 0 8px;color:var(--muted);font-weight:700}
.logo b{display:block;font-size:46px;letter-spacing:6px;color:var(--text);font-weight:900}
.logo .ball{display:block;width:34px;height:34px;margin:0 auto 10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f7ffb0,#c6e01e 60%,#9bb515);box-shadow:0 0 16px rgba(220,255,60,.5)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);letter-spacing:1px}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:none;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(47,140,255,.4)}
.primary{background:linear-gradient(180deg,#ffe066,#ffc107);color:#3a2a00;border:none;border-radius:14px;padding:14px;font-size:17px;font-weight:900;
  letter-spacing:2px;margin-top:6px;box-shadow:0 4px 0 #b38600}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #b38600}
.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:14px;font-weight:700}
.ver{text-align:center;color:var(--muted);font-size:11px;opacity:.7}
.how ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.55}
.how li b{color:var(--accent)}
.how .shots{display:grid;gap:6px;font-size:13px;background:rgba(255,255,255,.05);border-radius:10px;padding:10px}
.how .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dot.flat{background:#1e88e5}.dot.topspin{background:#43a047}.dot.slice{background:#fb8c00}.dot.lob{background:#8e24aa}
.how .keys{font-size:11.5px;color:var(--muted);text-align:center}
.result{text-align:center}
.result .big{font-size:40px;font-weight:900;letter-spacing:2px}
.result.win .big{color:var(--accent);text-shadow:0 0 20px rgba(255,213,74,.5)}
.result.lose .big{color:#90a4ae}
.result .final{font-size:30px;font-weight:800}
.result .sub{color:var(--muted);font-size:13px}
.stats{width:100%;border-collapse:collapse;font-size:14px}
.stats td{width:25%;font-weight:800;padding:5px 0;font-variant-numeric:tabular-nums}
.stats th{font-weight:500;color:var(--muted);font-size:12px}
.stats tr + tr{border-top:1px solid var(--line)}

body[data-phase=menu] #hud,body[data-phase=menu] #controls,body[data-phase=menu] #hint,body[data-phase=menu] #call{display:none}

#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:var(--bg);color:var(--muted);font-size:14px;letter-spacing:2px;text-align:center;padding:24px}
#loading pre{font-size:11px;white-space:pre-wrap;color:#ef9a9a;max-width:90vw}
#loading button{padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:#16324f}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (min-aspect-ratio: 1/1){
  #stickZone{width:45%;height:70%}
  #hint{top:calc(12px + var(--safe-t))}
  #call{top:calc(52px + var(--safe-t))}
}
</style>
</head>
<body data-phase="menu">
<div id="stage"></div>

<div id="hud" hidden>
  <div class="board">
    <div class="row"><div class="name" id="sbName0">あなた</div><div class="g" id="sbGames0">0</div><div class="p" id="sbPts0">0</div></div>
    <div class="row"><div class="name" id="sbName1">CPU</div><div class="g" id="sbGames1">0</div><div class="p" id="sbPts1">0</div></div>
    <div class="tag" id="sbTag">NORMAL</div>
  </div>
  <button id="pauseBtn" aria-label="ポーズ">II</button>
</div>
<div id="call"></div>
<div id="msg" class="msg"></div>
<div id="hint"></div>

<div id="controls" hidden>
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div id="shots">
    <button class="shot" data-shot="lob">ロブ</button>
    <button class="shot" data-shot="topspin">トップ</button>
    <button class="shot" data-shot="flat">フラット</button>
    <button class="shot" data-shot="slice">スライス</button>
  </div>
</div>

<div id="overlay" hidden></div>

<div id="loading"><div class="spinner"></div><div>LOADING</div></div>

<script>
  // 起動時のエラーをローディング画面に表示する
  window.addEventListener('error', function (e) {
    var el = document.getElementById('loading');
    if (el && e.message) el.insertAdjacentHTML('beforeend', '<pre>' + e.message + '</pre><button onclick="location.reload()">再読み込み</button>');
  });
</script>
<script type="module" src="./js/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
    // 旧バージョンの SW から新しい SW に切り替わったときだけ再読み込み
    var reloaded = false, hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloaded || !hadController) return;
      reloaded = true;
      location.reload();
    });
  }
</script>
</body>
</html>
